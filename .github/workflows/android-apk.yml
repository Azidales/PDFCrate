name: PDFCrate APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            image: 26
            target: default
          - api: 33
            image: 33
            target: default
          - api: 35
            image: 35
            target: default
          - api: 36
            image: 36-ext19
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ matrix.api != 36 }}
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;36.0.0'
      - name: Build APK and check lint
        if: matrix.api == 36
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug :app:lintRelease
      - name: Build instrumentation packages
        if: matrix.api != 36
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Publish unsigned release for private signing
        if: matrix.api == 36
        uses: actions/upload-artifact@v4
        with:
          name: PDFCrate-0.4.0-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.image }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: false
          script: bash scripts/test-reader.sh ${{ matrix.api }}
      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDFCrate-verification-api-${{ matrix.api }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/screenshots/
            app/build/device-results/
            app/build/upgrade/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
